[Settings]
gtk-application-prefer-dark-theme=true
gtk-button-images=true
gtk-cursor-blink=true
gtk-cursor-blink-time=1000
gtk-cursor-theme-name=Bibata-Modern-Classic
gtk-cursor-theme-size=24
gtk-decoration-layout=icon:minimize,maximize,close
gtk-enable-animations=true
gtk-font-name=Monocraft, 10
gtk-icon-theme-name=Papirus-Dark
gtk-menu-images=true
gtk-modules=colorreload-gtk-module:window-decorations-gtk-module
gtk-primary-button-warps-slider=true
gtk-sound-theme-name=ocean
# Breeze GTK mirrors the active KDE color scheme — kdeglobals' [General]
# ColorScheme=DarkSea, so this pulls in the same dark_sea palette. Needs the
# breeze-gtk package (now in install.sh); without it GTK silently falls back
# to Adwaita and most of the system looks unthemed outside Thunar's
# hand-written gtk.css override.
gtk-theme-name=Breeze
gtk-toolbar-style=3
gtk-xft-dpi=98304
