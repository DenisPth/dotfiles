# driftwm — example "home dashboard" rice
#
# An opinionated starting point: a single Quickshell dashboard pinned at the
# canvas origin (your "home"), plus power-canvas defaults. Install with
# `extras/install.sh`. Everything here is optional — `config.reference.toml`
# documents every setting, and partial configs merge with built-in defaults, so
# trim this to taste.

autostart = [
    "waybar",
    "kanshi",
    "swaync",
    "swayosd-server --top-margin 0.95",
    "qs -p ~/.config/driftwm/quickshell",
    "~/.config/driftwm/scripts/battery_notify.sh",
    # История буфера обмена (cliphist); выбор записи — mod+v.
    "wl-paste --type text --watch cliphist store",
    "wl-paste --type image --watch cliphist store",
    # Автоблокировка через 5 минут бездействия + перед уходом в сон (раньше
    # блокировка срабатывала только перед сном).
    "swayidle -w timeout 1800 'swaylock -c 2a3841 --inside-color 394149 --ring-color 5a636a --text-color e3e7eb --key-hl-color 97d6ff' before-sleep 'swaylock -c 2a3841 --inside-color 394149 --ring-color 5a636a --text-color e3e7eb --key-hl-color 97d6ff'",
]

# Sloppy focus: windows don't overlap, so a cursor over a window is deliberate.
# Pairs with hover -> `mod+c` / 4-finger hold to target windows when zoomed out.
focus_follows_mouse = true

# Place a new window adjacent to the focused window's cluster.
window_placement = "auto"

[session]
# Closed-at-logout windows come back suspended; the camera returns where it was.
restore_windows = true
restore_camera = true

[background]
type = "shader"
path = "~/.config/driftwm/wallpapers/dark_sea.glsl"
#path = "~/.config/driftwm/wallpapers/animated/fast_smoke.glsl"
#path = "~/.config/driftwm/wallpapers/textured/mirrored_parallax.glsl"

[snap]
# Extra snap targets (off by default): other windows' corners and centers.
# corners = true
# centers = true

[effects]
# Blur strength under the frosted overlays (swaync, launcher, swayosd) below.
blur_radius = 5
blur_strength = 1.5
# Snappier, slightly springy window open/close/move/resize animation.
# animation_speed: lerp factor, higher = faster (1 = instant). Default 0.5.
# animation_scale: grow/shrink amplitude on open/close (1 = fade only). Default 0.95.
animation_speed = 0.75
animation_scale = 0.88

[navigation]
# The origin — where the dashboard sits — is a navigation target even with no
# window there (4-finger swipe / Mod+Arrow toward it).
anchors = [[0, 0]]

[zoom]
reset_on_new_window = false
# Below half zoom a window is too small to use: a click navigates to it instead.
interact_min = 0.5

[mouse]
decoration_resize_snapped = true
decoration_fit_snapped = true

[decorations]
# Dark SSD title bars matching the system-wide dark_sea color scheme.
bg_color = "#2a3841"
fg_color = "#e3e7eb"

[input.keyboard]
layout = "us,ru"
# Layout switch on Alt+Shift. Caps Lock left untouched — works as normal
# Caps Lock (uppercase letters + its own LED indicator).
options = "grp:alt_shift_toggle"
remember_layout_per_window = true

[keybindings]
"mod+n" = "spawn swaync-client -t"
"mod+shift+q" = "suspend-window"
# Spotlight: one search over open windows, suspended windows, and installed
# apps — it replaces the plain launcher on mod+d.
"mod+d" = "exec ~/.config/driftwm/scripts/spotlight.sh"
"mod+v" = "exec ~/.config/driftwm/scripts/clipboard.sh"
# Terminal: ghostty, themed to match the dark_sea wallpaper (see
# ghostty/config).
"mod+Return" = "spawn ghostty"
"mod+e" = "spawn thunar"
# Telegram Desktop
"mod+t" = "spawn Telegram"
# Cluster-first: the unshifted key acts on the snapped cluster (the defaults are
# single-window).
"mod+m" = "fit-window-snapped"
"mod+shift+m" = "fit-window"
# Route media keys through swayosd for on-screen feedback.
"XF86AudioRaiseVolume" = "spawn swayosd-client --output-volume raise"
"XF86AudioLowerVolume" = "spawn swayosd-client --output-volume lower"
"XF86AudioMute" = "spawn swayosd-client --output-volume mute-toggle"
"XF86MonBrightnessUp" = "spawn swayosd-client --brightness raise"
"XF86MonBrightnessDown" = "spawn swayosd-client --brightness lower"
# Screenshot the focused window straight to the clipboard.
"ctrl+print" = "spawn driftwm msg screenshot window -o - | wl-copy"
# Hyprshot: interactive region screenshot to clipboard.
"mod+shift+s" = "spawn hyprshot -m region --clipboard-only"
# Toggle screen recording for TikTok clips (region-picked, saved to ~/Videos/tiktok).
"mod+shift+v" = "spawn ~/.config/driftwm/scripts/record_clip.sh"
"mod+alt+shift+q" = "exec systemctl poweroff"
"Super+L" = "exec swaylock"
"mod + a" = "spawn zen-browser"
# GNOME-Settings-style window (wifi/bluetooth/sound/etc) — toggled via
# quickshell IPC since it's a window this same shell process already owns.
"mod+s" = "exec qs -p ~/.config/driftwm/quickshell ipc call settings toggle"

[mouse.on-window]
"alt+middle" = "fill-window"

[gestures.on-window]
# Cluster-first, matching the keybindings above.
"alt+3-finger-swipe" = "resize-window-snapped"
"alt+shift+3-finger-swipe" = "resize-window"

# The home dashboard, pinned at the canvas origin. `position` is the window
# center (Y-up).
[[window_rules]]
app_id = "drift-dashboard"
position = [0, 0]
widget = true
# Frosted glass look for the dashboard itself.
blur = true

# The settings window, toggled with mod+s. A real app window now (not a
# canvas-pinned widget) — matched by title since it's a plain xdg-toplevel,
# not a layer-shell surface with its own app_id-like namespace. It opens,
# moves, and resizes like any other window; window_placement = "auto" (top
# of this file) decides where it lands.
[[window_rules]]
title = "Настройки"
blur = true

# Frost the terminals too, matching the transparency set in
# ghostty/config/kitty.conf (background-opacity/alpha=0.85 both).
[[window_rules]]
app_id = "com.mitchellh.ghostty"
blur = true

[[window_rules]]
app_id = "kitty"
blur = true

# Frost the transient shell overlays: their themes are translucent, so the
# compositor blurs the canvas behind them. (The dashboard stays solid — it's
# always on screen, where blur would be a constant cost.)
[[window_rules]]
app_id = "swaync-control-center"
blur = true

[[window_rules]]
app_id = "swaync-notification-window"
blur = true

[[window_rules]]
app_id = "launcher"
blur = true

[[window_rules]]
app_id = "swayosd"
blur = true

[[window_rules]]
app_id = "waybar"
widget = true

[[outputs]]
name = "DP-1"
mode = "1920x1080@165"  # частота обновления — подставьте герцовку своего монитора
scale = 1.0
[env]
GTK_THEME = "Adwaita:dark"
XCURSOR_THEME = "Bibata-Modern-Classic"
XCURSOR_SIZE = "24"


# =============================================================================
# СВОДКА БИНДОВ (справочно, ни на что не влияет)
# =============================================================================
#
# --- Клавиатура / раскладка ---
# Alt+Shift                       — переключение раскладки us <-> ru
#
# --- Управление окнами (keybindings) ---
# mod+n                           — открыть/переключить центр уведомлений (swaync)
# mod+shift+q                     — suspend-window (свернуть окно в фон)
# mod+d                           — Spotlight: поиск по окнам/приложениям
# mod+v                           — история буфера обмена (cliphist + fuzzel)
# mod+Return                       — открыть терминал (ghostty)
# mod+e                            — открыть проводник (Thunar)
# mod+t                           — открыть Telegram Desktop
# mod+m                           — fit-window-snapped (подогнать снапнутый кластер)
# mod+shift+m                     — fit-window (подогнать только текущее окно)
# ctrl+print                      — скриншот активного окна в буфер обмена
# mod+shift+s                     — hyprshot: скриншот области в буфер обмена
# mod+shift+v                     — запись видео с экрана (тумблер, ~/Videos/tiktok)
# mod+alt+shift+q                 — systemctl poweroff (выключение системы)
#
# --- Медиа-клавиши (через swayosd) ---
# XF86AudioRaiseVolume            — громкость +
# XF86AudioLowerVolume            — громкость -
# XF86AudioMute                   — mute toggle
# XF86MonBrightnessUp             — яркость +
# XF86MonBrightnessDown           — яркость -
#
# --- Мышь на окне (mouse.on-window) ---
# alt+middle                      — fill-window (развернуть окно на весь канвас)
#
# --- Жесты на окне (gestures.on-window) ---
# alt+3-finger-swipe              — resize-window-snapped (ресайз кластера)
# alt+shift+3-finger-swipe        — resize-window (ресайз только окна)
#
# =============================================================================
