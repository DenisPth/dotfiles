# ~/.config/foot/foot.ini
# Color palette matched to the dark_sea.glsl wallpaper (dark blue-grey
# marble with warm cream veins). Matches waybar styling.

font=Monocraft:size=11
pad=10x10 center

[colors-dark]
# Base background/foreground
background=2b323c
foreground=c9c4ab

# Regular colors (0-7)
regular0=2b323c
regular1=b5665f
regular2=8a9a7c
regular3=c9b98a
regular4=7089a0
regular5=9a8aa0
regular6=7fa6a0
regular7=c9c4ab

# Bright colors (8-15)
bright0=4b5560
bright1=c77a72
bright2=9dad8f
bright3=dcccA0
bright4=87a0b8
bright5=ac9cb3
bright6=93bab4
bright7=e2ddc4

# Cursor text/background colors (replaces deprecated [cursor].color)
cursor=2b323c c9c4ab

# Background transparency (0.0 = fully transparent, 1.0 = opaque)
alpha=0.85

[cursor]
style=beam

[mouse]
hide-when-typing=yes

[scrollback]
lines=10000
